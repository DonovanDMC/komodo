name: Release

# Every push to main gets a Core image and a release with the
# Periphery binaries, both tagged with the same version:
#   ghcr.io/<owner>/komodo-core:<version>
#   release v<version> with periphery-x86_64
# where <version> is the latest upstream version in the history
# plus the short commit sha, ie 2.3.3-780ac68.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.sha }}

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      registry: ${{ steps.version.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          # Upstream release commits are titled with the version, ie "2.3.3 (#1605)"
          base=$(git log --format=%s | grep -m1 -oE '^[0-9]+\.[0-9]+\.[0-9]+' || echo 0.0.0)
          echo "version=$base-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      REGISTRY: ${{ needs.version.outputs.registry }}
      # The Dockerfiles point these at upstream
      LABELS: |
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.version=${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build binaries
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bin/binaries.Dockerfile
          platforms: linux/amd64
          build-args: VERSION=${{ env.VERSION }}
          labels: ${{ env.LABELS }}
          tags: ${{ env.REGISTRY }}/komodo-binaries:${{ env.VERSION }}
          push: true
          cache-from: type=gha,scope=binaries
          cache-to: type=gha,mode=max,scope=binaries

      - name: Extract periphery
        run: |
          id=$(docker create "$REGISTRY/komodo-binaries:$VERSION" /periphery)
          docker cp "$id:/periphery" periphery-x86_64
          docker rm "$id"

      - name: Build core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bin/core/single-arch.Dockerfile
          platforms: linux/amd64
          build-args: BINARIES_IMAGE=${{ env.REGISTRY }}/komodo-binaries:${{ env.VERSION }}
          labels: ${{ env.LABELS }}
          tags: |
            ${{ env.REGISTRY }}/komodo-core:${{ env.VERSION }}
            ${{ env.REGISTRY }}/komodo-core:latest
          push: true
          cache-from: type=gha,scope=core
          cache-to: type=gha,mode=max,scope=core

      # Only after the image is pushed, so a release always has its image
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" periphery-x86_64 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes "Core image: \`$REGISTRY/komodo-core:$VERSION\`"
